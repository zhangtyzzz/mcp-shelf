<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCP Shelf · 本地工具工作台</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside>
      <header>
        <img src="/icon.svg" alt="">
        <div>
          <strong>MCP Shelf</strong>
          <small>本地工具工作台</small>
        </div>
      </header>
      <div class="overline">工作区</div>
      <nav aria-label="管理页面">
        <button data-view="sources">
          <svg class="nav-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2.5" width="12" height="4" rx="1.2"/>
            <rect x="2" y="9.5" width="12" height="4" rx="1.2"/>
            <circle cx="4.5" cy="4.5" r=".7" fill="currentColor" stroke="none"/>
            <circle cx="4.5" cy="11.5" r=".7" fill="currentColor" stroke="none"/>
          </svg>
          <span>连接管理</span>
        </button>
        <button data-view="tools">
          <svg class="nav-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="2" y="2" width="5" height="5" rx="1.2"/>
            <rect x="9" y="2" width="5" height="5" rx="1.2"/>
            <rect x="2" y="9" width="5" height="5" rx="1.2"/>
            <rect x="9" y="9" width="5" height="5" rx="1.2"/>
          </svg>
          <span>工具目录</span>
        </button>
        <button data-view="logs">
          <svg class="nav-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <circle cx="8" cy="8" r="5.8"/>
            <path d="M8 5v3.2l2.2 1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>调用记录</span>
        </button>
        <button data-view="meta">
          <svg class="nav-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M2.5 4h11M2.5 8h8M2.5 12h11" stroke-linecap="round"/>
          </svg>
          <span>元工具描述</span>
        </button>
        <button data-view="clients">
          <svg class="nav-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M6 10l6-6M8 4h4v4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 10.5V12a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 3 12V6a1.5 1.5 0 0 1 1.5-1.5H6" stroke-linecap="round"/>
          </svg>
          <span>接入 Agent</span>
        </button>
      </nav>
      <footer>
        <i class="live"></i> <span id="mode-label">本地实例</span> <small>v0.4</small>
      </footer>
    </aside>
    <main>
      <div class="top">
        <div class="crumbs">工作台 <span>/</span> <b id="crumb">连接管理</b></div>
        <div class="tag"><i class="live"></i> <span id="instance-tag">仅本机</span></div>
      </div>
      <div id="content" aria-busy="true">正在读取本地配置…</div>
    </main>
  </div>

  <div id="toast" role="status" hidden></div>

  <dialog id="dialog" aria-labelledby="form-title">
    <form id="form">
      <header>
        <div>
          <small>CONNECTION</small>
          <h2 id="form-title">添加连接</h2>
        </div>
        <button id="x" type="button" class="icon-btn" aria-label="关闭">×</button>
      </header>
      <div class="form-inner">
        <div class="cols">
          <label>连接 ID<input name="id" required maxlength="48" placeholder="local-docs"></label>
          <label>显示名<input name="label" maxlength="100" placeholder="本地文档"></label>
        </div>
        <label>连接描述<textarea name="description" rows="2" maxlength="1000"></textarea></label>
        <label>连接方式
          <select name="transport">
            <option value="stdio">本地进程 · stdio</option>
            <option value="http">远程端点 · Streamable HTTP</option>
          </select>
        </label>
        <div id="stdio">
          <label>可执行文件<input name="command" placeholder="/opt/homebrew/bin/node"></label>
          <label>参数（JSON 字符串数组）<textarea name="args" rows="2" placeholder='["/absolute/path/server.js"]'></textarea></label>
          <div class="cols">
            <label>工作目录（可选）<input name="cwd" placeholder="/absolute/path"></label>
            <label>传入的环境变量名<input name="envKeys" placeholder="API_TOKEN, ANOTHER_KEY"></label>
          </div>
        </div>
        <div id="http" hidden>
          <label>Streamable HTTP URL<input name="url" placeholder="https://example.com/mcp"></label>
          <label>Bearer Token 的环境变量名（可选）<input name="bearerEnv" placeholder="MY_MCP_TOKEN"></label>
        </div>
        <label class="check"><input type="checkbox" name="enabled" checked>启用连接</label>
        <p class="tip">只添加可信服务。本地进程以你的系统账号运行。更换上游地址或进程会清除旧授权。</p>
        <p id="error" role="alert"></p>
      </div>
      <footer class="actions">
        <button type="button" id="cancel">取消</button>
        <button type="submit" class="primary">保存连接</button>
      </footer>
    </form>
  </dialog>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <form id="import-form">
      <header>
        <div>
          <small>IMPORT CONNECTIONS</small>
          <h2 id="import-title">导入已有 MCP 配置</h2>
        </div>
        <button id="import-x" type="button" class="icon-btn" aria-label="关闭">×</button>
      </header>
      <div class="form-inner">
        <label>粘贴配置片段（支持 Claude / Antigravity / Cursor 的 mcpServers JSON，或 Codex 的 config.toml）
          <textarea id="import-text" rows="7" placeholder='{"mcpServers":{"filesystem":{"command":"npx","args":["-y","@modelcontextprotocol/server-filesystem","/path"]}}}'></textarea>
        </label>
        <p class="tip">为保障安全，导入只会提取环境变量名（envKeys），绝不保存明文 Secret；所有新导入连接默认不开放任何工具。</p>
        <div id="import-preview" hidden></div>
        <p id="import-error" class="err" role="alert"></p>
      </div>
      <footer class="actions">
        <button type="button" id="import-cancel">取消</button>
        <button type="button" id="import-check">解析预览</button>
        <button type="submit" id="import-submit" class="primary">确认导入</button>
      </footer>
    </form>
  </dialog>
</body>
</html>
