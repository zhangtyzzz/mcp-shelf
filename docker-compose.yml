services:
  mcp-shelf:
    # Prebuilt multi-arch image from GHCR (switch :stable -> :alpha for preview builds, or uncomment `build: .`)
    image: ghcr.io/zhangtyzzz/mcp-shelf:stable
    # build: .
    container_name: mcp-shelf
    restart: unless-stopped
    ports:
      # Bind to host loopback and front with Caddy / Nginx Proxy Manager for automatic HTTPS
      - "127.0.0.1:8787:8787"
    environment:
      MCP_SHELF_MODE: "remote"
      MCP_SHELF_HOST: "0.0.0.0"
      MCP_SHELF_PORT: "8787"
      MCP_SHELF_HOME: "/data"
      # Required in remote mode (>= 12 chars). Generate via: openssl rand -base64 24
      MCP_SHELF_ADMIN_PASSWORD: "${MCP_SHELF_ADMIN_PASSWORD:?Set MCP_SHELF_ADMIN_PASSWORD (>=12 chars)}"
      # Recommended: your public HTTPS URL (for reverse-proxy Host/Origin checks & client snippets)
      MCP_SHELF_PUBLIC_URL: "${MCP_SHELF_PUBLIC_URL:-https://mcp.example.com}"
      # Pass upstream MCP credentials via env vars (never written into config.json):
      # GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # LINEAR_API_KEY: "${LINEAR_API_KEY:-}"
    volumes:
      - mcp_shelf_data:/data

volumes:
  mcp_shelf_data:
