name: Feature Request
description: Suggest a new feature, harness improvement, or locale translation
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What workflow or agent pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should MCP Shelf behave? Remember MCP Shelf stays harness-agnostic.
    validations:
      required: true
