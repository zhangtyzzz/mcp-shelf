name: Docker

on:
  push:
    branches:
      - master
      - alpha
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - alpha

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: github.ref_type == 'tag'
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ "$RELEASE_TAG" =~ ^v${version}$ ]]; then
            if [[ "${RELEASE_TAG#v}" != "$(node -p 'require("./package.json").version')" ]]; then
              echo 'Release tag must match package.json' >&2
              exit 1
            fi
            echo 'channel=stable' >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" =~ ^v${version}-alpha\.(0|[1-9][0-9]*)$ ]]; then
            echo 'channel=alpha' >> "$GITHUB_OUTPUT"
          else
            echo 'Expected vX.Y.Z or vX.Y.Z-alpha.N' >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,prefix=master-,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=alpha,enable=${{ github.ref == 'refs/heads/alpha' }}
            type=sha,prefix=alpha-,enable=${{ github.ref == 'refs/heads/alpha' }}
            type=semver,pattern={{version}},enable=${{ steps.release.outputs.channel != '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.channel == 'stable' }}
            type=semver,pattern={{major}},enable=${{ steps.release.outputs.channel == 'stable' }}
            type=raw,value=stable,enable=${{ steps.release.outputs.channel == 'stable' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.channel == 'stable' }}
            type=raw,value=alpha,enable=${{ steps.release.outputs.channel == 'alpha' }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
